[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "flixchurn"
version = "1.0.0"
description = "AI Customer Churn Prediction & Retention Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aquil Shiyon"}]

dependencies = [
    # Core
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",

    # ML
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.42",
    "imbalanced-learn>=0.11",

    # Experiment tracking
    "mlflow>=2.8",

    # Backend
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",

    # Analytics
    "duckdb>=0.9",
    "pyarrow>=14.0",

    # Orchestration
    "apache-airflow>=2.7",

    # Utilities
    "structlog>=23.2",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "httpx>=0.25",
    "ruff>=0.1",
    "mypy>=1.7",
]

[tool.setuptools.packages.find]
include = ["ml*", "apps*", "pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
